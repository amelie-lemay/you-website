<div class="popup-overlay" data-id="overlay" role="dialog" aria-modal="true" aria-labelledby="progress-title">
    <div class="popup">
        <button class="popup-close" data-id="close" aria-label="Close popup">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>

        <p class="popup-intro" id="progress-title" data-when="onboarding">No one likes spoilers...</p>
        <p class="popup-text" data-when="onboarding">
            What's the latest chapter you've read? The website's content will adapt to your progress.
        </p>
        <p class="popup-intro" data-when="update">You've made some progress!</p>

        <div class="chapter-stepper">
            <button class="stepper-btn" data-id="dec" aria-label="Previous chapter">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6" />
                </svg>
            </button>
            <span data-id="chapter-display">1</span>
            <button class="stepper-btn" data-id="inc" aria-label="Next chapter">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6" />
                </svg>
            </button>
        </div>

        <div class="popup-checkbox">
            <label>
                <input type="checkbox" data-id="finished" />
                <span>I finished reading</span>
            </label>
        </div>

        <div class="popup-actions">
            <button class="button button--primary" data-id="save">Let's go</button>
            <button class="button button--secondary" data-id="visitor" data-when="onboarding">I'm just
                visiting</button>
        </div>
    </div>
</div>
