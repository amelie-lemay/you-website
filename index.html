<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Merriweather&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/shared.css">
    <link rel="stylesheet" href="/css/home.css">
    <script type="module" src="/js/shared.js"></script>
    <script type="module" src="/js/home.js"></script>
</head>

<body>
    <header></header>

    <section class="chapter-update"></section>

    <main>
        <div id="content-wrapper">
            <section class="hero">
                <img alt="Book Artwork" class="hero-bg" id="hero-bg" loading="eager">
                <h1 id="book-title"></h1>
                <p id="book-tagline"></p>
                <a href="map.html" class="button">Explore the map</a>
            </section>

            <section class="section">
                <h2>Book Synopsis</h2>
                <p class="synopsis" id="book-synopsis"></p>
                <p class="tip">Would you rather have a teaser?</p>
                <a href="content/you_chapter1.pdf" class="button" target="_blank">Read the first chapter</a>
            </section>

            <section class="section">
                <h2>Step Into the Lore</h2>
                <div class="cards cards--row">
                    <a href="map.html" class="card">
                        <div class="card-content">
                            <h3>Map</h3>
                            <p id="card-map-desc"></p>
                        </div>
                        <span class="link">Explore</span>
                    </a>
                    <a href="translation.html" class="card">
                        <div class="card-content">
                            <h3>Translation</h3>
                            <p id="card-translation-desc"></p>
                        </div>
                        <span class="link">Read Here</span>
                    </a>
                    <a href="characters.html" class="card">
                        <div class="card-content">
                            <h3>Characters</h3>
                            <p id="card-characters-desc"></p>
                        </div>
                        <span class="link">Meet Them</span>
                    </a>
                </div>
            </section>

            <section class="section">
                <h2>About This Website</h2>
                <p id="about-website"></p>
            </section>

            <section class="section section--updates">
                <h2>Latest Updates</h2>
                <ul class="updates-list" id="latest-updates">
                    <!-- Example of updates
                        <li>📢 Volume II coming Winter 2025!</li>
                        <li>🗺️ Map updated with new region: The Glade of Echoes</li>
                        <li>🎨 Fan art contest open until June 30</li>
                    -->
                </ul>
            </section>
        </div>

        <div id="error-wrapper" hidden>
            <p id="error-message" role="alert" aria-live="assertive">
                Sorry, something went wrong while loading the content. Please refresh or try again later.
            </p>
        </div>
    </main>

    <footer></footer>

    <a class="back-to-top"></a>

    <template id="progress-modal-template"></template>
</body>

</html>
