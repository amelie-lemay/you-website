<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Merriweather&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/shared.css">
    <link rel="stylesheet" href="/css/map.css">
    <script type="module" src="/js/shared.js"></script>
    <script type="module" src="/js/map.js"></script>
</head>

<body>
    <header></header>

    <section class="chapter-update"></section>

    <main>
        <div id="content-wrapper">
            <section class="section">
                <h2>Jane's Map</h2>
                <div id="map-wrapper">
                    <img class="map-image" id="map-image" alt="Jane's Map" loading="eager">
                    <div id="regions-container"></div>
                </div>

                <aside class="legend" aria-label="Map legend">
                    <div class="legend-head">
                        <button class="legend-toggle" aria-expanded="true" aria-controls="legend-grid" id="legendToggle">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9" />
                            </svg>
                        </button>
                        <h3>Map Legend</h3>
                    </div>
                
                    <div class="legend-grid legend-expanded" id="legend-grid">
                        <div class="legend-group" id="legend-biomes">
                            <div class="legend-item">
                                <img class="icon plains" src="img/home-temp.jpg" alt="Plains icon">
                                <div class="label">Plains</div>
                            </div>
                    
                            <div class="legend-item">
                                <img class="icon sparse-forest" src="img/home-temp.jpg" alt="Sparse forest icon">
                                <div class="label">Sparse forest</div>
                            </div>
                    
                            <div class="legend-item">
                                <img class="icon forest" src="img/home-temp.jpg" alt="Forest icon">
                                <div class="label">Forest</div>
                            </div>
                    
                            <div class="legend-item">
                                <img class="icon dense-forest" src="img/home-temp.jpg" alt="Dense forest icon">
                                <div class="label">Dense forest</div>
                            </div>
                    
                            <div class="legend-item">
                                <img class="icon rocky" src="img/home-temp.jpg" alt="Rocky terrain icon">
                                <div class="label">Rocky terrain</div>
                            </div>
                    
                            <div class="legend-item">
                                <img class="icon water" src="img/home-temp.jpg" alt="Water icon">
                                <div class="label">Water</div>
                            </div>
                        </div>
                
                        <div class="legend-group" id="legend-buildings">
                            <div class="legend-item .buildings-row">
                                <img class="icon village" src="img/home-temp.jpg" alt="Village icon">
                                <div class="label">Building</div>
                            </div>
                    
                            <div class="legend-item .buildings-row">
                                <img class="icon city" src="img/home-temp.jpg" alt="City icon">
                                <div class="label">Group</div>
                            </div>
                        </div>
                    </div>
                </aside>
            </section>
            
            <section class="section">
                <h2>Major groups</h2>
                <div id="major-groups" class="cards">
                    <!-- Major groups card structure
                        <div class="card card--hover">
                            <h3 class="section-heading">Name</h3>
                            <p><strong>Member count:</strong> Member count</p>
                            <p class="card-underline"><strong>Location:</strong> Location</p>
                            <p class="card-description">Description</p>
                        </div>
                    -->
                </div>
            </section>
            
            <section class="section">
                <h2>Notable Buildings</h2>
                <div id="notable-buildings" class="cards">
                    <!-- Notable buildings card structure
                        <div class="card card--hover">
                            <h3 class="section-heading">Name</h3>
                            <p><strong>Belongs to:</strong> Group</p>
                            <p><strong>Usage:</strong> Description.</p>
                            <p class="card-description">Optional note</p>
                        </div>
                    -->
                </div>
            </section>
        </div>

        <div id="error-wrapper" hidden>
            <p id="error-message" role="alert" aria-live="assertive">
                Sorry, something went wrong while loading the content. Please refresh or try again later.
            </p>
        </div>
    </main>

    <footer></footer>

    <a class="back-to-top"></a>

    <template id="progress-modal-template"></template>
</body>

</html>
