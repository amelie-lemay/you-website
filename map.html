<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Merriweather&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/shared.css">
    <link rel="stylesheet" href="/css/map.css">
    <script type="module" src="/js/shared.js"></script>
    <script type="module" src="/js/map.js"></script>
</head>

<body>
    <header></header>

    <section class="chapter-update"></section>

    <main>
        <div id="content-wrapper">
            <section class="section">
                <h2>Jane's Map</h2>
                <div id="map-wrapper">
                    <img class="map-image" id="map-image" alt="Jane's Map" loading="eager">
                    <div id="regions-container"></div>
                </div>

                <aside class="legend" aria-label="Map legend">
                    <div class="legend-head">
                        <button class="legend-toggle" aria-expanded="true" aria-controls="legend-grid" id="legendToggle">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9" />
                            </svg>
                        </button>
                        <h3>Map Legend</h3>
                    </div>
                
                    <div class="legend-grid legend-expanded" id="legend-grid">
                        <!-- Legend item structure
                            <div class="legend-group" id="legend-<group-id>">
                                <div class="legend-item">
                                    <img class="icon" src="img/<icon-file>" alt="<icon-alt>">
                                    <div class="legend-label"><Label text></div>
                                </div>
                            </div>
                        -->
                    </div>
                </aside>
            </section>
            
            <section class="section">
                <h2>Major groups</h2>
                <div id="major-groups" class="cards">
                    <!-- Major groups card structure
                        <div class="card card--hover">
                            <h3 class="section-heading">Name</h3>
                            <div class="card-meta card-underline">
                                <div class="label">Member count:</div>
                                <div>Member count</div>
                                <div class="label">Location:</div>
                                <div>Location</div>
                            </div>
                            <p class="card-description">Description</p>
                        </div>
                    -->
                </div>
            </section>
            
            <section class="section">
                <h2>Notable Buildings</h2>
                <div id="notable-buildings" class="cards">
                    <!-- Notable buildings card structure
                        <div class="card card--hover">
                            <h3 class="section-heading">Name</h3>
                            <div class="card-meta">
                                <div class="label">Belongs to:</div>
                                <div>Group</div>
                                <div class="label">Usage:</div>
                                <div>Description</div>
                            </div>
                            <p class="card-description">Optional note</p>
                        </div>
                    -->
                </div>
            </section>
        </div>

        <div id="error-wrapper" hidden>
            <p id="error-message" role="alert" aria-live="assertive">
                Sorry, something went wrong while loading the content. Please refresh or try again later.
            </p>
        </div>
    </main>

    <footer></footer>

    <a class="back-to-top"></a>

    <template id="progress-modal-template"></template>
</body>

</html>
